<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pong 2P - AG Arcade</title><link rel="icon" href="/assets/arcade/icon.svg"><link rel="stylesheet" href="/assets/arcade/arcade.css"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column}main{flex:1;display:grid;place-items:center;padding:16px}.wrap{width:min(760px,100%);text-align:center}canvas{width:100%;max-width:720px;aspect-ratio:16/9;background:#0f1722;border:1px solid #334155;border-radius:12px;touch-action:none}.hud{display:flex;justify-content:space-between;gap:12px;margin:10px 0;font:600 14px system-ui}button{font:600 13px system-ui;padding:8px 12px;border-radius:10px;border:1px solid #475569;background:#1e293b;color:#fff;cursor:pointer}.hint{opacity:.8;font:13px system-ui;margin-top:8px}</style></head><body class="player-page"><header class="player-header"><a href="/#games">&larr; AG Arcade</a><h1>Pong 2P</h1><button id="fullscreen">Fullscreen</button></header><main><div class="wrap"><div class="hud"><span>Left: <strong id="l">0</strong> (W/S)</span><span>Right: <strong id="r">0</strong> (↑/↓)</span><button id="restart">Restart</button></div><canvas id="c" width="720" height="405"></canvas><p class="hint">Local 2-player. First to 7 wins. On touch, drag left/right side to move paddles.</p></div></main><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let l={x:20,y:160,w:12,h:85,s:0},r={x:688,y:160,w:12,h:85,s:0},b,ls=0,rs=0,keys={},over=false;
function serve(dir){b={x:360,y:202,r:8,dx:5*dir,dy:(Math.random()*4-2)||2};}
function reset(){ls=0;rs=0;l.y=160;r.y=160;over=false;document.getElementById('l').textContent=0;document.getElementById('r').textContent=0;serve(Math.random()>.5?1:-1);} 
function draw(){ctx.fillStyle='#0f1722';ctx.fillRect(0,0,c.width,c.height);ctx.strokeStyle='#334155';ctx.setLineDash([8,10]);ctx.beginPath();ctx.moveTo(360,0);ctx.lineTo(360,405);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#e2e8f0';ctx.fillRect(l.x,l.y,l.w,l.h);ctx.fillRect(r.x,r.y,r.w,r.h);ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();if(over){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='700 34px system-ui';ctx.fillText((ls>rs?'Left':'Right')+' player wins!',360,210);}}
function step(){if(!over){if(keys.w)l.y-=7;if(keys.s)l.y+=7;if(keys.ArrowUp)r.y-=7;if(keys.ArrowDown)r.y+=7;l.y=Math.max(0,Math.min(c.height-l.h,l.y));r.y=Math.max(0,Math.min(c.height-r.h,r.y));b.x+=b.dx;b.y+=b.dy;if(b.y<b.r||b.y>c.height-b.r)b.dy*=-1;
if(b.x-b.r<l.x+l.w&&b.y>l.y&&b.y<l.y+l.h&&b.dx<0){b.dx=Math.abs(b.dx)+0.2;b.dy+=(b.y-(l.y+l.h/2))*0.08;}
if(b.x+b.r>r.x&&b.y>r.y&&b.y<r.y+r.h&&b.dx>0){b.dx=-(Math.abs(b.dx)+0.2);b.dy+=(b.y-(r.y+r.h/2))*0.08;}
if(b.x<0){rs++;document.getElementById('r').textContent=rs; if(rs>=7)over=true; else serve(1);} if(b.x>c.width){ls++;document.getElementById('l').textContent=ls; if(ls>=7)over=true; else serve(-1);} }
draw();requestAnimationFrame(step);} 
addEventListener('keydown',e=>{if(['w','s','ArrowUp','ArrowDown'].includes(e.key))keys[e.key]=true;});addEventListener('keyup',e=>{if(['w','s','ArrowUp','ArrowDown'].includes(e.key))keys[e.key]=false;});
c.addEventListener('pointermove',e=>{const rect=c.getBoundingClientRect(),x=(e.clientX-rect.left)/rect.width*c.width,y=(e.clientY-rect.top)/rect.height*c.height; if(x<c.width/2) l.y=y-l.h/2; else r.y=y-r.h/2;});
document.getElementById('restart').onclick=reset;document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();};reset();requestAnimationFrame(step);
</script></body></html>
