<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossy Hop - AG Arcade</title><link rel="icon" href="/assets/arcade/icon.svg"><link rel="stylesheet" href="/assets/arcade/arcade.css"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column}main{flex:1;display:grid;place-items:center;padding:16px}.wrap{width:min(520px,100%);text-align:center}canvas{width:100%;max-width:420px;aspect-ratio:7/10;background:#6ecf68;border:1px solid #334155;border-radius:12px;touch-action:none}.hud{display:flex;justify-content:space-between;gap:12px;margin:10px 0;font:600 14px system-ui}button{font:600 13px system-ui;padding:8px 12px;border-radius:10px;border:1px solid #475569;background:#1e293b;color:#fff;cursor:pointer}.hint{opacity:.8;font:13px system-ui;margin-top:8px}</style></head><body class="player-page"><header class="player-header"><a href="/#games">&larr; AG Arcade</a><h1>Crossy Hop</h1><button id="fullscreen">Fullscreen</button></header><main><div class="wrap"><div class="hud"><span>Score: <strong id="score">0</strong></span><span>Best: <strong id="best">0</strong></span><button id="restart">Restart</button></div><canvas id="c" width="420" height="600"></canvas><p class="hint">Arrow keys/WASD or tap/swipe to hop forward, left, and right. Don’t get hit.</p></div></main><script>
const c=document.getElementById('c'),ctx=c.getContext('2d'),W=7,H=10,T=60;let rows,player,score,best=Number(localStorage.getItem('agArcade.crossyhop.best')||0),over,offset;
document.getElementById('best').textContent=best;
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function makeRow(y){const t=Math.random();if(t<0.35)return {y,type:'grass'}; if(t<0.7)return {y,type:'road',speed:(Math.random()<.5?-1:1)*(1.2+Math.random()*1.6),cars:Array.from({length:rand(1,3)},(_,i)=>({x:rand(0,6)+i*3,w:2}))}; return {y,type:'river',speed:(Math.random()<.5?-1:1)*(1+Math.random()*1.2),logs:Array.from({length:rand(2,3)},(_,i)=>({x:rand(0,6)+i*2.5,w:2}))};}
function reset(){rows=[];for(let y=0;y<14;y++)rows.push(y<3?{y,type:'grass'}:makeRow(y));player={x:3,y:1};score=0;over=false;offset=0;draw();}
function draw(){ctx.clearRect(0,0,c.width,c.height);for(const r of rows){const sy=c.height-(r.y+1-offset)*T; if(sy>c.height||sy<-T)continue; if(r.type==='grass'){ctx.fillStyle='#6ecf68';ctx.fillRect(0,sy,c.width,T);} else if(r.type==='road'){ctx.fillStyle='#70757d';ctx.fillRect(0,sy,c.width,T);ctx.fillStyle='#f7d774';for(let i=0;i<W;i++)ctx.fillRect(i*T+18,sy+28,24,4);ctx.fillStyle='#ef4444';r.cars.forEach(car=>ctx.fillRect(((car.x%W)+W)%W*T+6,sy+10,car.w*T-12,T-20));} else {ctx.fillStyle='#4cc9f0';ctx.fillRect(0,sy,c.width,T);ctx.fillStyle='#8b5a2b';r.logs.forEach(log=>ctx.fillRect(((log.x%W)+W)%W*T+4,sy+12,log.w*T-8,T-24));}}
const py=c.height-(player.y+1-offset)*T; ctx.fillStyle='#fff'; ctx.fillRect(player.x*T+14,py+14,32,32); ctx.fillStyle='#111';ctx.fillRect(player.x*T+22,py+22,5,5);ctx.fillRect(player.x*T+33,py+22,5,5); ctx.fillStyle='#f59e0b';ctx.fillRect(player.x*T+28,py+28,10,6);
ctx.fillStyle='#111827aa';ctx.fillRect(0,0,c.width,38);ctx.fillStyle='#fff';ctx.font='700 18px system-ui';ctx.textAlign='left';ctx.fillText('Score '+score,12,25);
if(over){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='700 34px system-ui';ctx.fillText('Game Over',210,290);ctx.font='16px system-ui';ctx.fillText('Press Restart',210,320);} }
function rowAt(y){return rows.find(r=>Math.abs(r.y-y)<0.01)}
function step(){if(over){draw();requestAnimationFrame(step);return;}rows.forEach(r=>{if(r.speed){if(r.cars)r.cars.forEach(o=>o.x+=r.speed*0.03); if(r.logs)r.logs.forEach(o=>o.x+=r.speed*0.03);} });
const r=rowAt(player.y); if(r){ if(r.type==='road'){const hit=r.cars.some(car=>{const x=((car.x%W)+W)%W; return player.x+0.8>x && player.x+0.2<x+car.w;}); if(hit)die(); }
if(r.type==='river'){const on=r.logs.some(log=>{const x=((log.x%W)+W)%W; return player.x+0.5>x && player.x+0.5<x+log.w;}); if(!on)die(); else player.x += r.speed*0.03; if(player.x< -1||player.x>W)die(); } }
const maxY=Math.max(...rows.map(r=>r.y)); while(maxY - player.y < 10){rows.push(makeRow(Math.max(...rows.map(r=>r.y))+1));}
rows=rows.filter(r=>r.y>player.y-6); draw(); requestAnimationFrame(step);} 
function die(){if(over)return;over=true;best=Math.max(best,score);localStorage.setItem('agArcade.crossyhop.best',best);document.getElementById('best').textContent=best;draw();}
function move(dx,dy){if(over)return;const nx=Math.max(0,Math.min(W-1,Math.round(player.x)+dx));const ny=player.y+dy; if(dy<0)return; player.x=nx;player.y=ny; if(dy>0){score=Math.max(score,ny-1);document.getElementById('score').textContent=score;} if(player.y-offset>4)offset=player.y-4; draw();}
addEventListener('keydown',e=>{const k=e.key; if(k==='ArrowUp'||k==='w'||k==='W')move(0,1); if(k==='ArrowDown'||k==='s'||k==='S')move(0,-1); if(k==='ArrowLeft'||k==='a'||k==='A')move(-1,0); if(k==='ArrowRight'||k==='d'||k==='D')move(1,0);});
let sx,sy;c.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;});c.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy;if(Math.abs(dx)<12&&Math.abs(dy)<12){move(0,1);return;} if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1,0); else move(0,dy<0?1:-1);});
document.getElementById('restart').onclick=reset;document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();};reset();requestAnimationFrame(step);
</script></body></html>
