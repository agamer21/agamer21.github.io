<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0d121c" />
    <meta name="description" content="Play the Super Mario 64 PC port right in your browser. WebGL, no game files needed." />
    <title>Super Mario 64 Player — AG Arcade</title>
    <link rel="icon" href="/assets/arcade/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/assets/arcade/arcade.css" />
  </head>
  <body class="player-page mario-page">
    <header class="player-header">
      <a href="/#games">&larr; AG Arcade</a>
      <h1>Super Mario 64 <span style="font-weight:400;color:#9ba98f;font-size:10px">PC port · WebGL · saves in your browser</span></h1>
      <button id="fullscreen" type="button">Fullscreen &nearr;</button>
    </header>
    <div class="mario-notice">
      <span>The Super Mario 64 PC port loads from its public host. WASD to move, Space to start, and check the in-page controls. Use <button id="own-file" class="mario-reference-link" type="button">Nintendo 64 version</button> to pick your own game file instead.</span>
    </div>
    <iframe
      id="game"
      class="player-frame"
      src="/files/load/sm64webgl/index.html"
      title="Super Mario 64 browser player"
      allow="fullscreen; autoplay; gamepad"
      allowfullscreen
    ></iframe>
    <script>
      var SM64_WEBGL_SRC = "/files/load/sm64webgl/index.html";
      var SM64_N64_SRC = "/files/load/webretro/index.html?core=mupen64plus_next&nobundle";
      var webglMode = true;
      document.getElementById("own-file").onclick = function () {
        webglMode = !webglMode;
        document.getElementById("game").src = webglMode ? SM64_WEBGL_SRC : SM64_N64_SRC;
        document.getElementById("own-file").textContent = webglMode ? "Nintendo 64 version" : "PC port version";
      };
      document.getElementById("fullscreen").addEventListener("click", function () {
        var frame = document.getElementById("game");
        if (frame.requestFullscreen) {
          frame.requestFullscreen().catch(function () {
            document.getElementById("fullscreen").textContent = "Fullscreen unavailable";
          });
        }
      });
    </script>
  </body>
</html>
