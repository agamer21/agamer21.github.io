<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Idle Breakout - AG Arcade</title><link rel="icon" href="/assets/arcade/icon.svg"><link rel="stylesheet" href="/assets/arcade/arcade.css"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column}main{flex:1;display:grid;place-items:center;padding:16px}.wrap{width:min(980px,100%);display:grid;grid-template-columns:1fr 300px;gap:14px;align-items:start}canvas{width:100%;max-width:640px;aspect-ratio:16/10;background:#0f1722;border:1px solid #334155;border-radius:12px}.panel{border:1px solid #334155;border-radius:12px;background:#111827;padding:12px;font:14px system-ui}.row{display:flex;justify-content:space-between;gap:8px;margin:6px 0}button{font:600 13px system-ui;padding:8px 10px;border-radius:10px;border:1px solid #475569;background:#1e293b;color:#fff;cursor:pointer;width:100%;margin-top:6px}button:disabled{opacity:.5;cursor:not-allowed}.hint{opacity:.8;font:13px system-ui;margin-top:8px}@media(max-width:900px){.wrap{grid-template-columns:1fr}}</style></head><body class="player-page"><header class="player-header"><a href="/#games">&larr; AG Arcade</a><h1>Idle Breakout</h1><button id="fullscreen">Fullscreen</button></header><main><div class="wrap"><div><canvas id="c" width="640" height="400"></canvas><p class="hint">Click bricks to damage them, earn money, buy balls and upgrades. Progress saves automatically.</p></div><div class="panel"><div class="row"><span>Money</span><strong id="money">$0</strong></div><div class="row"><span>Level</span><strong id="level">1</strong></div><div class="row"><span>Balls</span><strong id="balls">0</strong></div><div class="row"><span>Power</span><strong id="power">1</strong></div><div class="row"><span>Best Level</span><strong id="best">1</strong></div><hr style="border-color:#334155;opacity:.5">
<button id="buyBall">Buy Basic Ball ($<span id="ballCost">25</span>)</button>
<button id="buyPower">Upgrade Click Power ($<span id="powerCost">50</span>)</button>
<button id="buySpeed">Upgrade Ball Speed ($<span id="speedCost">75</span>)</button>
<button id="next">Next Level</button>
<button id="reset">Reset Save</button>
</div></div></main><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');const SKEY='agArcade.idlebreakout.v1';
let state={money:0,level:1,best:1,power:1,ballCount:0,speed:1,ballCost:25,powerCost:50,speedCost:75};
try{Object.assign(state,JSON.parse(localStorage.getItem(SKEY)||'{}'));}catch{}
let bricks=[],balls=[];
function save(){localStorage.setItem(SKEY,JSON.stringify(state));}
function levelHp(l){return Math.max(1,Math.floor(1 + l*0.8 + Math.pow(l,1.15)*0.15));}
function makeBricks(){bricks=[];const cols=10,rows=5,hp=levelHp(state.level),val=Math.max(1,Math.floor(1+state.level*0.4));for(let r=0;r<rows;r++)for(let i=0;i<cols;i++)bricks.push({x:24+i*60,y:40+r*30,w:52,h:22,hp:hp,max:hp,val:val,alive:true});}
function spawnBall(){balls.push({x:320,y:350,r:6,dx:(Math.random()<.5?-1:1)*(2.2*state.speed),dy:-2.4*state.speed,color:['#60a5fa','#34d399','#fbbf24','#f472b6','#a78bfa'][balls.length%5]});}
function syncBalls(){while(balls.length<state.ballCount)spawnBall(); if(balls.length>state.ballCount)balls.length=state.ballCount;}
function addMoney(n){state.money+=n;}
function damageBrick(b,d){if(!b.alive)return; b.hp-=d; if(b.hp<=0){b.alive=false;addMoney(b.val);} if(bricks.every(x=>!x.alive)){state.level++; state.best=Math.max(state.best,state.level); makeBricks();} updateUI(); save();}
function updateUI(){document.getElementById('money').textContent='$'+Math.floor(state.money);document.getElementById('level').textContent=state.level;document.getElementById('balls').textContent=state.ballCount;document.getElementById('power').textContent=state.power;document.getElementById('best').textContent=state.best;document.getElementById('ballCost').textContent=state.ballCost;document.getElementById('powerCost').textContent=state.powerCost;document.getElementById('speedCost').textContent=state.speedCost;
document.getElementById('buyBall').disabled=state.money<state.ballCost;document.getElementById('buyPower').disabled=state.money<state.powerCost;document.getElementById('buySpeed').disabled=state.money<state.speedCost;}
function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#0f1722';ctx.fillRect(0,0,c.width,c.height);
for(const b of bricks){if(!b.alive)continue;const p=Math.max(0,b.hp/b.max);ctx.fillStyle=`hsl(${p*120} 70% 45%)`;ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='rgba(255,255,255,.85)';ctx.font='700 12px system-ui';ctx.textAlign='center';ctx.fillText(Math.ceil(b.hp),b.x+b.w/2,b.y+15);} 
for(const ball of balls){ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle=ball.color;ctx.fill();}
}
function step(){for(const ball of balls){ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<ball.r||ball.x>c.width-ball.r)ball.dx*=-1;if(ball.y<ball.r||ball.y>c.height-ball.r)ball.dy*=-1;for(const b of bricks){if(!b.alive)continue;if(ball.x>b.x-ball.r&&ball.x<b.x+b.w+ball.r&&ball.y>b.y-ball.r&&ball.y<b.y+b.h+ball.r){const overlapX=Math.min(ball.x-(b.x-ball.r),(b.x+b.w+ball.r)-ball.x);const overlapY=Math.min(ball.y-(b.y-ball.r),(b.y+b.h+ball.r)-ball.y);if(overlapX<overlapY)ball.dx*=-1;else ball.dy*=-1;damageBrick(b,1);break;}}}
draw();requestAnimationFrame(step);} 
c.addEventListener('click',e=>{const r=c.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*c.width,y=(e.clientY-r.top)/r.height*c.height;for(const b of bricks){if(b.alive&&x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){damageBrick(b,state.power);break;}}});
document.getElementById('buyBall').onclick=()=>{if(state.money<state.ballCost)return;state.money-=state.ballCost;state.ballCount++;state.ballCost=Math.floor(state.ballCost*1.45+10);syncBalls();updateUI();save();};
document.getElementById('buyPower').onclick=()=>{if(state.money<state.powerCost)return;state.money-=state.powerCost;state.power++;state.powerCost=Math.floor(state.powerCost*1.6+15);updateUI();save();};
document.getElementById('buySpeed').onclick=()=>{if(state.money<state.speedCost)return;state.money-=state.speedCost;state.speed=Math.min(3,state.speed+0.15);state.speedCost=Math.floor(state.speedCost*1.55+20);balls.forEach(b=>{const sx=Math.sign(b.dx)||1,sy=Math.sign(b.dy)||-1;b.dx=sx*2.2*state.speed;b.dy=sy*2.4*state.speed;});updateUI();save();};
document.getElementById('next').onclick=()=>{state.level++;state.best=Math.max(state.best,state.level);makeBricks();updateUI();save();};
document.getElementById('reset').onclick=()=>{if(!confirm('Reset Idle Breakout progress?'))return;localStorage.removeItem(SKEY);state={money:0,level:1,best:1,power:1,ballCount:0,speed:1,ballCost:25,powerCost:50,speedCost:75};balls=[];makeBricks();syncBalls();updateUI();save();};
document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();};
makeBricks();syncBalls();updateUI();requestAnimationFrame(step);
</script></body></html>
