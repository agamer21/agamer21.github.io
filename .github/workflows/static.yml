name: Publish AG Arcade
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /index.html
            /move-saves.html
            /library.html
            /404.html
            /LICENSE
            /manifest.webmanifest
            /bloons-td6.html
            /drive-mad.html
            /agar.html
            /fnae.html
            /angry-birds-2.html
            /half-life.html
            /basket-bros.html
            /2048.html
            /wordle.html
            /hexgl.html
            /hextris.html
            /tank-arena.html
            /retro-bowl.html
            /moto-x3m.html
            /tiny-fishing.html
            /retro-bowl-college.html
            /super-mario-64.html
            /snake.html
            /minesweeper.html
            /tetris.html
            /breakout.html
            /pong.html
            /idle-breakout.html
            /slope.html
            /run-3.html
            /cookie-clicker.html
            /flappy-bird.html
            /crossy-hop.html
            /moon-sweepers/
            /granny/
            /pokemon-3ds/
            /geometry-dash/
            /assets/arcade/
            /files/drive-mad/
            /files/slope/
            /files/run3/
            /files/cookieclicker/
            /files/load/retro-bowl/
            /files/load/rbcollege/
            /files/load/sm64webgl/
            /files/load/flappy-bird/
            /files/load/webretro/index.html
            /files/load/webretro/assets/
            /files/load/webretro/cores/mupen64plus_next_libretro.js
            /files/load/webretro/cores/mupen64plus_next_libretro.wasm
            /files/load/webretro/uauth/
            /files/load/webretro/info/
            /files/load/webretro/manifest.json
            /files/load/webretro/pwa.js
            /files/load/webretro/pwa-sw.js
            /files/load/webretro/LICENSE
            /files/games/fnae/
            /files/games/basketbros-io/
            /files/games/2048/
            /files/games/wordle/
            /files/games/hexgl/
            /files/games/hextris/
            /files/games/moto-x3m/
            /files/games/tiny-fishing/
            /files/games/idle-breakout/
            /files/games/slope-real/
            /files/games/cookie-clicker-real/
      - name: Prepare curated site
        run: |
          mkdir -p site/assets site/files/load site/files/games site/files/load/webretro/cores
          cp index.html move-saves.html library.html 404.html LICENSE manifest.webmanifest \
             bloons-td6.html drive-mad.html agar.html fnae.html angry-birds-2.html half-life.html basket-bros.html \
             2048.html wordle.html hexgl.html hextris.html tank-arena.html retro-bowl.html moto-x3m.html tiny-fishing.html \
             retro-bowl-college.html super-mario-64.html snake.html minesweeper.html tetris.html breakout.html pong.html \
             idle-breakout.html slope.html run-3.html cookie-clicker.html flappy-bird.html crossy-hop.html site/
          cp -R moon-sweepers geometry-dash granny pokemon-3ds site/
          cp -R assets/arcade site/assets/
          cp -R files/drive-mad files/slope files/run3 files/cookieclicker site/files/
          cp -R files/load/retro-bowl files/load/rbcollege files/load/sm64webgl files/load/flappy-bird site/files/load/
          cp files/load/webretro/index.html files/load/webretro/manifest.json files/load/webretro/pwa.js files/load/webretro/pwa-sw.js site/files/load/webretro/
          cp files/load/webretro/LICENSE site/files/load/webretro/
          cp -R files/load/webretro/assets files/load/webretro/uauth files/load/webretro/info site/files/load/webretro/
          cp files/load/webretro/cores/mupen64plus_next_libretro.js files/load/webretro/cores/mupen64plus_next_libretro.wasm site/files/load/webretro/cores/
          cp -R files/games/fnae files/games/basketbros-io files/games/2048 files/games/wordle files/games/hexgl files/games/hextris files/games/moto-x3m files/games/tiny-fishing files/games/idle-breakout files/games/slope-real files/games/cookie-clicker-real site/files/games/
          touch site/.nojekyll
      - name: Prepare pinned Angry Birds runtime
        run: python3 .github/scripts/prepare-angry-birds.py site/files/games/angry-birds-2/Build
      - name: Include shared online counter
        run: python3 .github/scripts/add-presence.py site
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Geometry Dash release resources
        run: |
          curl --fail --location --retry 3 'https://github.com/agamer21/agamer21.github.io/releases/download/arcade-downloads/Resources.zip' --output "$RUNNER_TEMP/geometry-dash-resources.zip"
          node .github/scripts/prepare-geometry-dash.mjs "$RUNNER_TEMP/geometry-dash-resources.zip" site/geometry-dash
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
