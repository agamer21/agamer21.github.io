<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Minesweeper - AG Arcade</title><link rel="icon" href="/assets/arcade/icon.svg"><link rel="stylesheet" href="/assets/arcade/arcade.css"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column}main{flex:1;display:grid;place-items:center;padding:16px}.wrap-game{width:min(720px,100%)}.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}.left{display:flex;gap:8px;align-items:center;flex-wrap:wrap}select,button{font:600 13px system-ui;padding:8px 10px;border-radius:10px;border:1px solid #475569;background:#1e293b;color:#fff}button{cursor:pointer}#grid{display:grid;gap:4px;justify-content:center;touch-action:manipulation}.cell{width:34px;height:34px;border-radius:6px;border:1px solid #334155;background:#334155;color:#fff;font:700 14px system-ui;display:grid;place-items:center;user-select:none}.cell.revealed{background:#0f172a;border-color:#1e293b}.cell.flag{background:#7c2d12}.cell.mine{background:#991b1b}.status{font:600 14px system-ui}.hint{opacity:.8;font:13px system-ui;margin-top:8px}@media(max-width:520px){.cell{width:30px;height:30px;font-size:13px}}</style></head><body class="player-page"><header class="player-header"><a href="/#games">&larr; AG Arcade</a><h1>Minesweeper</h1><button id="fullscreen">Fullscreen</button></header><main><div class="wrap-game"><div class="bar"><div class="left"><select id="level"><option value="easy">Easy 9×9 (10)</option><option value="medium" selected>Medium 16×16 (40)</option><option value="hard">Hard 16×30 (99)</option></select><button id="new">New game</button></div><div class="status">Mines: <span id="mines">0</span> · Time: <span id="time">0</span></div></div><div id="grid"></div><p class="hint">Left click/tap to reveal. Right click/long press to flag. Clear all safe cells to win.</p></div></main><script>
const gridEl=document.getElementById('grid'),minesEl=document.getElementById('mines'),timeEl=document.getElementById('time'),levelEl=document.getElementById('level');
const levels={easy:[9,9,10],medium:[16,16,40],hard:[16,30,99]};
let R,C,M,cells,started,over,timer,secs,flags;
function idx(r,c){return r*C+c}
function neighbors(r,c){const out=[];for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){if(!dr&&!dc)continue;const nr=r+dr,nc=c+dc;if(nr>=0&&nr<R&&nc>=0&&nc<C)out.push([nr,nc]);}return out}
function newGame(){[R,C,M]=levels[levelEl.value];cells=Array.from({length:R*C},()=>({mine:false,rev:false,flag:false,n:0}));started=false;over=false;flags=0;secs=0;clearInterval(timer);timeEl.textContent='0';minesEl.textContent=M;render();}
function placeMines(sr,sc){let placed=0;while(placed<M){const r=Math.floor(Math.random()*R),c=Math.floor(Math.random()*C);if(Math.abs(r-sr)<=1&&Math.abs(c-sc)<=1)continue;const cell=cells[idx(r,c)];if(cell.mine)continue;cell.mine=true;placed++;}
for(let r=0;r<R;r++)for(let c=0;c<C;c++){if(cells[idx(r,c)].mine)continue;cells[idx(r,c)].n=neighbors(r,c).filter(([nr,nc])=>cells[idx(nr,nc)].mine).length;}}
function reveal(r,c){const cell=cells[idx(r,c)];if(cell.rev||cell.flag||over)return;if(!started){started=true;placeMines(r,c);timer=setInterval(()=>{secs++;timeEl.textContent=secs;},1000);}cell.rev=true;if(cell.mine){over=true;clearInterval(timer);cells.forEach(x=>{if(x.mine)x.rev=true;});render('Boom! You hit a mine.');return;}if(cell.n===0)neighbors(r,c).forEach(([nr,nc])=>reveal(nr,nc));checkWin();render();}
function toggleFlag(r,c){const cell=cells[idx(r,c)];if(cell.rev||over)return;if(!started){started=true;placeMines(r,c);timer=setInterval(()=>{secs++;timeEl.textContent=secs;},1000);}cell.flag=!cell.flag;flags+=cell.flag?1:-1;minesEl.textContent=Math.max(0,M-flags);render();}
function checkWin(){const safe=cells.filter(c=>!c.mine).every(c=>c.rev);if(safe){over=true;clearInterval(timer);render('You cleared the field!');}}
function render(msg){gridEl.style.gridTemplateColumns=`repeat(${C}, auto)`;gridEl.innerHTML='';for(let r=0;r<R;r++)for(let c=0;c<C;c++){const cell=cells[idx(r,c)],b=document.createElement('button');b.className='cell'+(cell.rev?' revealed':'')+(cell.flag?' flag':'')+(cell.rev&&cell.mine?' mine':'');
if(cell.rev){if(cell.mine)b.textContent='💣';else if(cell.n)b.textContent=cell.n,b.style.color=['','#93c5fd','#86efac','#fca5a5','#c4b5fd','#fdba74','#67e8f9','#e5e7eb','#f9a8d4'][cell.n];}
else if(cell.flag)b.textContent='🚩';
let press; b.addEventListener('click',()=>reveal(r,c)); b.addEventListener('contextmenu',e=>{e.preventDefault();toggleFlag(r,c);});
b.addEventListener('pointerdown',()=>{press=setTimeout(()=>toggleFlag(r,c),450);}); b.addEventListener('pointerup',()=>clearTimeout(press)); b.addEventListener('pointerleave',()=>clearTimeout(press));
gridEl.appendChild(b);} if(msg){const s=document.createElement('div');s.className='hint';s.textContent=msg;gridEl.after(s);setTimeout(()=>s.remove(),2500);} }
document.getElementById('new').onclick=newGame; levelEl.onchange=newGame; document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();}; newGame();
</script></body></html>
