<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Breakout - AG Arcade</title><link rel="icon" href="/assets/arcade/icon.svg"><link rel="stylesheet" href="/assets/arcade/arcade.css"><style>body{margin:0;min-height:100vh;display:flex;flex-direction:column}main{flex:1;display:grid;place-items:center;padding:16px}.wrap{width:min(720px,100%);text-align:center}canvas{width:100%;max-width:640px;aspect-ratio:16/10;background:#0f1722;border:1px solid #334155;border-radius:12px;touch-action:none}.hud{display:flex;justify-content:space-between;gap:12px;margin:10px 0;font:600 14px system-ui}button{font:600 13px system-ui;padding:8px 12px;border-radius:10px;border:1px solid #475569;background:#1e293b;color:#fff;cursor:pointer}.hint{opacity:.8;font:13px system-ui;margin-top:8px}</style></head><body class="player-page"><header class="player-header"><a href="/#games">&larr; AG Arcade</a><h1>Breakout</h1><button id="fullscreen">Fullscreen</button></header><main><div class="wrap"><div class="hud"><span>Score: <strong id="score">0</strong></span><span>Lives: <strong id="lives">3</strong></span><span>Best: <strong id="best">0</strong></span><button id="restart">Restart</button></div><canvas id="c" width="640" height="400"></canvas><p class="hint">Move with mouse/touch or Left/Right arrows. Break all bricks.</p></div></main><script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let paddle,ball,bricks,score,lives,best=Number(localStorage.getItem('agArcade.breakout.best')||0),over,won,keys={};
document.getElementById('best').textContent=best;
function reset(){paddle={w:110,h:14,x:265,y:370};ball={x:320,y:340,r:8,dx:4,dy:-4,stuck:false};bricks=[];const cols=10,rows=5,colors=['#ef4444','#f97316','#facc15','#22c55e','#38bdf8'];for(let r=0;r<rows;r++)for(let i=0;i<cols;i++)bricks.push({x:24+i*60,y:40+r*24,w:52,h:16,alive:true,color:colors[r]});score=0;lives=3;over=false;won=false;updateHud();}
function updateHud(){document.getElementById('score').textContent=score;document.getElementById('lives').textContent=lives;document.getElementById('best').textContent=best;}
function draw(){ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#0f1722';ctx.fillRect(0,0,c.width,c.height);bricks.forEach(b=>{if(!b.alive)return;ctx.fillStyle=b.color;ctx.fillRect(b.x,b.y,b.w,b.h);});ctx.fillStyle='#e2e8f0';ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();if(over||won){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,c.width,c.height);ctx.fillStyle='#fff';ctx.textAlign='center';ctx.font='700 34px system-ui';ctx.fillText(won?'You Win!':'Game Over',320,195);ctx.font='16px system-ui';ctx.fillText('Press Restart',320,230);} }
function step(){if(over||won){draw();requestAnimationFrame(step);return;}if(keys.ArrowLeft)paddle.x-=7;if(keys.ArrowRight)paddle.x+=7;paddle.x=Math.max(0,Math.min(c.width-paddle.w,paddle.x));ball.x+=ball.dx;ball.y+=ball.dy;if(ball.x<ball.r||ball.x>c.width-ball.r)ball.dx*=-1;if(ball.y<ball.r)ball.dy*=-1;if(ball.y>c.height+ball.r){lives--;if(lives<=0){over=true;best=Math.max(best,score);localStorage.setItem('agArcade.breakout.best',best);}else{ball.x=320;ball.y=340;ball.dx=4*(Math.random()>.5?1:-1);ball.dy=-4;paddle.x=265;}updateHud();}
if(ball.y+ball.r>=paddle.y&&ball.y-ball.r<=paddle.y+paddle.h&&ball.x>=paddle.x&&ball.x<=paddle.x+paddle.w&&ball.dy>0){const hit=(ball.x-(paddle.x+paddle.w/2))/(paddle.w/2);ball.dx=hit*5;ball.dy=-Math.abs(ball.dy);}
for(const b of bricks){if(!b.alive)continue;if(ball.x>b.x&&ball.x<b.x+b.w&&ball.y-ball.r<b.y+b.h&&ball.y+ball.r>b.y){b.alive=false;ball.dy*=-1;score+=10;updateHud();break;}}
if(bricks.every(b=>!b.alive)){won=true;best=Math.max(best,score);localStorage.setItem('agArcade.breakout.best',best);updateHud();}draw();requestAnimationFrame(step);}
addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')keys[e.key]=true;});addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight')keys[e.key]=false;});
function moveTo(clientX){const r=c.getBoundingClientRect();paddle.x=((clientX-r.left)/r.width)*c.width-paddle.w/2;paddle.x=Math.max(0,Math.min(c.width-paddle.w,paddle.x));}
c.addEventListener('mousemove',e=>moveTo(e.clientX));c.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')return;moveTo(e.clientX);});
document.getElementById('restart').onclick=reset;document.getElementById('fullscreen').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen();else document.exitFullscreen();};reset();requestAnimationFrame(step);
</script></body></html>
