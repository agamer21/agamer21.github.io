  <body>
    <h1
      style="
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      "
    >
      YukiOS - Free Browser-Based Desktop Environment
    </h1>
    <div id="selection-box"></div>

    <div id="desktop" class="desktop" role="presentation">
      <div id="start-menu" class="start-menu">
        <div class="start-sidebar">
          <div class="start-user">
            <img src="/assets/arcade/yukios/static/icons/guest.webp" alt="User avatar" />
            <span></span>
          </div>

          <div class="start-cat-list"></div>

          <div class="start-cat" data-cat="settingsApp">Settings</div>

          <div class="start-footer-actions">
            <button class="start-sleep-btn" id="start-sleep-btn" title="Sleep">
              <img
                src="/assets/arcade/icon.svg"
                class="papirus-icon papirus-icon--32"
                alt=""
              />
            </button>
            <button
              class="start-lock-btn"
              id="start-lock-btn"
              title="Lock System"
            >
              <img
                src="/assets/arcade/icon.svg"
                class="papirus-icon papirus-icon--32"
                alt=""
              />
            </button>
            <button
              class="start-signout-btn"
              id="start-signout-btn"
              title="Sign Out"
            >
              <img
                src="/assets/arcade/icon.svg"
                class="papirus-icon papirus-icon--32"
                alt=""
              />
            </button>
            <button
              class="start-shutdown-btn"
              id="start-shutdown-btn"
              title="Shutdown"
            >
              <img
                src="/assets/arcade/icon.svg"
                class="papirus-icon papirus-icon--32"
                alt=""
              />
            </button>
          </div>
        </div>

        <div class="start-content">
          <div class="search-input-wrapper">
            <img
              src="/assets/arcade/icon.svg"
              class="papirus-icon papirus-icon--22 search-icon"
              alt=""
            />
            <input
              id="start-menu-search"
              placeholder="Search..."
              autocomplete="off"
            />
          </div>

          <div class="start-page active" data-page="all">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="favorites"></div>

          <div class="start-page" data-page="recent">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="development">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="games">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="graphics">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="help">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="internet">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="media">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="office">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="system">
            <div class="app-grid"></div>
          </div>

          <div class="start-page" data-page="places">
            <div class="places-section"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="taskbar">
      <div id="mac-menu-bar">
        <span class="mac-menu-item mac-menu-apple" data-start="true"
          ><img
            src="/assets/arcade/icon.svg"
            class="papirus-icon papirus-icon--22"
            alt=""
        /></span>
        <span class="mac-menu-item" data-menu="Finder">Finder</span>
        <span class="mac-menu-item" data-menu="File">File</span>
        <span class="mac-menu-item" data-menu="Edit">Edit</span>
        <span class="mac-menu-item" data-menu="View">View</span>
        <span class="mac-menu-item" data-menu="Go">Go</span>
        <span class="mac-menu-item" data-menu="Window">Window</span>
        <span class="mac-menu-item" data-menu="Help">Help</span>
      </div>
      <div id="start-button"></div>
      <div id="taskbar-windows" style="display: flex"></div>
      <div id="system-tray">
        <div id="time-container">
          <div id="clock">12:00 PM</div>
          <div id="date">01/01/2026</div>
        </div>
        <div id="social-bar-container"></div>
      </div>
    </div>
