<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Search the web with Google from AG Arcade.">
  <title>Web Search | AG Arcade</title>
  <link rel="icon" href="/assets/arcade/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/arcade/arcade.css">
  <link rel="stylesheet" href="/assets/arcade/themes.css">
  <link rel="stylesheet" href="./web.css">
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem('agArcade.theme.v1') || 'midnight';
    } catch {
      document.documentElement.dataset.theme = 'midnight';
    }
  </script>
</head>
<body class="arcade-home web-hub">
  <header class="web-header web-wrap">
    <a class="web-back" href="/">← AG Arcade</a>
    <div class="header-actions"></div>
  </header>
  <main class="web-wrap">
    <h1>Web Search</h1>
    <form class="web-form" action="https://www.google.com/search" target="_blank" rel="noopener noreferrer">
      <label for="web-query">Google search</label>
      <div class="web-search">
        <input id="web-query" name="q" type="search" required>
        <button class="web-action" type="submit">Search</button>
      </div>
    </form>
  </main>
</body>
</html>
