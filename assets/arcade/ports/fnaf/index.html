<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Five Nights at Freddy's 1 Browser Demo</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#080808;color:#eee;display:grid;place-items:center}
    canvas{width:min(100vw,177.777vh);height:min(100vh,56.25vw);object-fit:contain;touch-action:none}
    #error{position:absolute;margin:24px;text-align:center;font:16px system-ui}
  </style>
  <script src="src/Runtime.js?v=local-demo-1"></script>
</head>
<body>
  <canvas id="MMFCanvas" width="1280" height="720"></canvas>
  <p id="error" role="status" hidden></p>
  <script>
    addEventListener('load', () => {
      try {
        new Runtime('MMFCanvas', 'resources/FNAF1HTML5.cch');
      } catch (error) {
        console.error(error);
        const status = document.getElementById('error');
        status.textContent = 'Could not start the demo. Reload the page to retry.';
        status.hidden = false;
      }
    });
  </script>
</body>
</html>
